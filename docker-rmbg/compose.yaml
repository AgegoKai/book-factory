name: rmbg2-auto-cutout

services:
  comfyui-rmbg:
    image: local/comfyui-rmbg2:0.12.2
    build:
      context: ..
      dockerfile: docker-rmbg/Dockerfile
    restart: unless-stopped
    ports:
      - "8189:8189"
    gpus: all
    shm_size: "8gb"
    environment:
      HF_HOME: /workspace/cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "900"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - type: bind
        source: D:/ComfyAi/models/RMBG
        target: /workspace/ComfyUI/models/RMBG
      - type: bind
        source: D:/ComfyAi/input
        target: /workspace/ComfyUI/input
      - type: bind
        source: D:/ComfyAi/output
        target: /workspace/ComfyUI/output
      - type: bind
        source: D:/ComfyAi/user
        target: /workspace/ComfyUI/user
      - type: bind
        source: D:/ComfyAi/temp-rmbg
        target: /workspace/ComfyUI/temp
      - type: bind
        source: D:/ComfyAi/hf_cache
        target: /workspace/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8189/system_stats', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
