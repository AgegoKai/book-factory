name: rmbg2-auto-cutout

services:
  comfyui-rmbg:
    profiles: ["light"]
    image: ${NJS_RMBG2_IMAGE:-local/comfyui-rmbg2:0.13.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        COMFYUI_REPOSITORY: ${NJS_COMFYUI_REPOSITORY:-https://github.com/Comfy-Org/ComfyUI.git}
        COMFYUI_REPOSITORY_MIRROR: ${NJS_COMFYUI_REPOSITORY_MIRROR:-}
        RMBG_REPOSITORY: ${NJS_RMBG_NODE_REPOSITORY:-https://github.com/1038lab/ComfyUI-RMBG.git}
        RMBG_REPOSITORY_MIRROR: ${NJS_RMBG_NODE_REPOSITORY_MIRROR:-}
    restart: unless-stopped
    ports:
      - "${NJS_AI_BIND_ADDRESS:-127.0.0.1}:${NJS_RMBG2_PORT:-8189}:8189"
    gpus: all
    shm_size: "8gb"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    stop_grace_period: 30s
    environment:
      HF_HOME: /workspace/cache/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "900"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NJS_RMBG2_MODEL_SHA256: 566ed80c3d95f87ada6864d4cbe2290a1c5eb1c7bb0b123e984f60f76b02c3a7
      NJS_RMBG2_CONFIG_SHA256: c97ea21569daf66b205491a4635147dd3bc42c7c168b89d7d75b53f67ef548ae
      NJS_RMBG2_CODE_SHA256: 8f498727f4bdb7dfaa4d66190f0ebf55392bda62c1b4f224be39f9b750a8915d
      NJS_RMBG2_CONFIG_CODE_SHA256: e7b8c2a74f6cea6a59553d517f71d47f2c1d90e670a13416af17c25fe2f3dc52
    volumes:
      - type: bind
        source: ${NJS_AI_MODELS_ROOT:?Set NJS_AI_MODELS_ROOT in nls-tools/ai-runtime/.env}/comfyui/RMBG
        target: /workspace/ComfyUI/models/RMBG
        read_only: true
      - type: bind
        source: ${NJS_AI_DATA_ROOT:?Set NJS_AI_DATA_ROOT in nls-tools/ai-runtime/.env}/workers/rmbg2/input
        target: /workspace/ComfyUI/input
      - type: bind
        source: ${NJS_AI_DATA_ROOT:?Set NJS_AI_DATA_ROOT in nls-tools/ai-runtime/.env}/workers/rmbg2/output
        target: /workspace/ComfyUI/output
      - type: bind
        source: ${NJS_AI_DATA_ROOT:?Set NJS_AI_DATA_ROOT in nls-tools/ai-runtime/.env}/workers/rmbg2/user
        target: /workspace/ComfyUI/user
      - type: bind
        source: ${NJS_AI_DATA_ROOT:?Set NJS_AI_DATA_ROOT in nls-tools/ai-runtime/.env}/workers/rmbg2/temp
        target: /workspace/ComfyUI/temp
      - type: bind
        source: ${NJS_AI_CACHE_ROOT:?Set NJS_AI_CACHE_ROOT in nls-tools/ai-runtime/.env}/rmbg2/huggingface
        target: /workspace/cache/huggingface
    networks:
      njs-ai:
        aliases: ["rmbg2-worker"]
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/worker-healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s

networks:
  njs-ai:
    external: true
    name: ${NJS_AI_NETWORK:-njs-ai}
