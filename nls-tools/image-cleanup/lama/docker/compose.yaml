name: lama-cleanup

services:
  lama-cleanup:
    image: local/lama-cleanup:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8080"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: D:/NlsTools/lama/models
        target: /data/models
      - type: bind
        source: D:/NlsTools/lama/input
        target: /data/input
      - type: bind
        source: D:/NlsTools/lama/output
        target: /data/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/server-config', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s
